name: Publish OIDC Discovery Documents

on:
  workflow_dispatch:
    inputs:
      target_stack:
        description: "Stack to publish ('all' or a specific stack name)"
        required: false
        default: "all"
        type: string
      target_stacks:
        description: "Optional CSV of stacks to publish (overrides target_stack)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Publish OIDC discovery
        uses: ./.github/actions/publish-oidc-discovery
        with:
          target_stacks: ${{ inputs.target_stacks }}
          target_stack: ${{ inputs.target_stack }}
          oidc_discovery_domain: ${{ vars.OIDC_DISCOVERY_DOMAIN }}
          oidc_discovery_stack_config: ${{ vars.OIDC_DISCOVERY_STACK_CONFIG }}
          oidc_discovery_pages_project: ${{ vars.OIDC_DISCOVERY_PAGES_PROJECT }}
          cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wait_for: none
